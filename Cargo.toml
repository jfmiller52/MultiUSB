[package]
name = "multiusb"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "MultiUSB"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
futures = "0.3"
iced = "0.14"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
